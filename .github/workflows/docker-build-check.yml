name: Docker Build and Publish

# Builds the single TuFT image (docker/Dockerfile) for CUDA 12 and 13.
# Pull requests build and smoke-test only. Pushes to main publish :dev tags,
# manual runs publish `branch-<name>` (unsafe characters become -), and published releases
# publish version and :latest tags to docker.io/k4black/tuft.
on:
  push:
    branches: [main]
  release:
    types: [published]
  pull_request:
    paths:
      - 'docker/**'
      - '.dockerignore'
      - 'scripts/verify_runtime_versions.py'
      - 'pyproject.toml'
      - '.github/workflows/docker-build-check.yml'
  workflow_dispatch:

permissions:
  contents: read

# Releases share one group and queue; main and PR runs cancel older ones.
concurrency:
  group: docker-${{ github.event_name == 'release' && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build-check:
    name: Build Docker (${{ matrix.variant }})
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Published as docker.io/k4black/<image>:<name><suffix>; the default
          # variant also gets the bare <name> tag.
          - variant: cu12
            image: tuft
            suffix: -cu12
            dockerfile: docker/Dockerfile
            build-args: VLLM_IMAGE=vllm/vllm-openai:v0.32.0-cu129
          - variant: cu13
            image: tuft
            suffix: -cu13
            default: true
            dockerfile: docker/Dockerfile
            build-args: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # GitHub Actions runners only have ~14GB available by default.
      # Clean preinstalled packages (Android, .NET, Haskell, swap) to free ~35GB.
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # release v0.3.0 -> 0.3.0 and latest (not for pre-releases); main -> dev;
      # manual run on build/x -> branch-build-x; pull requests build under a local tag
      # and push nothing.
      - name: Compute tags
        id: tags
        env:
          REPO: docker.io/k4black/${{ matrix.image }}
          SUFFIX: ${{ matrix.suffix }}
          DEFAULT: ${{ matrix.default }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            release) names="${GITHUB_REF_NAME#v}"; [ "$PRERELEASE" = true ] || names="$names latest" ;;
            push) names=dev ;;
            workflow_dispatch) names="branch-$(printf %s "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' -)" ;;
            *) echo "tags=tuft-test:${{ matrix.variant }}" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          tags=""
          for name in $names; do
            tags="$tags,$REPO:$name$SUFFIX"
            [ "$DEFAULT" = true ] && tags="$tags,$REPO:$name"
          done
          echo "tags=${tags#,}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The smoke test runs as the Dockerfile's last RUN, so nothing is loaded
      # into the local daemon. Layers come from the published :dev image; only
      # publishing runs write that (inline) cache.
      - name: Build Docker Image (${{ matrix.variant }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=docker.io/k4black/${{ matrix.image }}:dev${{ matrix.suffix }}
          cache-to: ${{ env.PUBLISH == 'true' && 'type=inline' || '' }}
